<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yt2jellyfin — Options</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2129; --border: #2c3640;
      --text: #e7ecf1; --muted: #8b98a5; --accent: #7b6cff; --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, sans-serif; padding: 28px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h1 span { color: var(--accent); }
    p.sub { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; max-width: 480px; background: var(--panel);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .row { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    #status { font-size: 13px; color: var(--ok); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1><span>yt</span>2jellyfin</h1>
  <p class="sub">Extension settings — where to send downloads.</p>

  <label for="server">Server URL</label>
  <input id="server" placeholder="http://127.0.0.1:8392" />
  <div class="hint">Default: http://127.0.0.1:8392 — run <code>yt2jellyfin serve</code> first.</div>

  <label for="dest">Default destination folder (optional)</label>
  <input id="dest" placeholder="leave empty to use library_path from config.yaml" />
  <div class="hint">Example: D:\media\youtube\Yassin — created automatically if missing.</div>

  <div class="row">
    <button id="save">Save</button>
    <button id="test" style="background:transparent;border:1px solid var(--border);color:var(--muted)">Test connection</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
