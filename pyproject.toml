[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2jellyfin"
version = "0.1.0"
description = "Download YouTube videos directly into a Jellyfin library with metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.12.13",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0",
]

[project.scripts]
yt2jellyfin = "yt2jellyfin.cli:main"

[tool.setuptools.packages.find]
include = ["yt2jellyfin*"]
